<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9acdc8">
<meta name="description" content="Explore un parc aquatique inspiré de la biologie. Monte dans ta bouée, découvre les îles et joue à seize petites aventures.">
<title>BioParc — Entre dans l’aventure</title>

<style>
:root{
  --ink:#254f48;
  --paper:#fffdf2;
  --line:#dce5cc;
  --green:#315e50;
  font-family:Arial,sans-serif;
  color:var(--ink);
  font-size:15px;
  line-height:1.5;
}
*{box-sizing:border-box}
body{margin:0;overflow:hidden;background:#9acdc8}
button,input{font:inherit}
button{
  cursor:pointer;
  touch-action:manipulation;
  color:inherit;
  border:1px solid #d6dec8;
  background:var(--paper);
  border-radius:14px;
  padding:11px 17px;
  font-weight:600;
  transition:background .18s,transform .18s;
}
button:hover{background:#eaf0d9}
button:active{transform:translateY(1px)}
button:disabled{opacity:.4;cursor:default}
button:focus-visible,input:focus-visible,summary:focus-visible,[tabindex]:focus-visible{
  outline:3px solid #795aab;
  outline-offset:4px;
}
h1,h2,h3,p{margin:0}
h1{font:normal clamp(24px,3vw,35px)/1.1 Georgia,serif;letter-spacing:-.6px}
h2{font:normal 28px/1.1 Georgia,serif}
h3{font:normal 25px/1.2 Georgia,serif}
small,.muted{color:#64786d}
.eyebrow{
  font-size:10px;
  letter-spacing:2px;
  font-weight:700;
  display:block;
  margin-bottom:8px;
}
.primary{background:var(--green);border-color:var(--green);color:#fffdf2}
.primary:hover{background:#447560}
.icon-button{width:42px;height:42px;padding:0;font-size:24px;flex-shrink:0}

#park{
  position:relative;
  width:100%;
  height:100vh;
  height:100dvh;
  isolation:isolate;
  overflow:hidden;
  background:radial-gradient(ellipse at 20% 10%,#d3e8cc,#9acdc8 55%,#78b7b5);
}
#viewport{position:absolute;inset:0;touch-action:none;cursor:grab}
#viewport.dragging{cursor:grabbing}
#park-svg{width:100%;height:100%;display:block;user-select:none}
.hud{
  position:absolute;
  z-index:3;
  top:max(20px,env(safe-area-inset-top));
  left:24px;
  right:24px;
  display:flex;
  justify-content:space-between;
  align-items:flex-start;
  gap:12px;
  pointer-events:none;
}
.hud button{pointer-events:auto;box-shadow:0 8px 28px #35656012}
.brand{
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px 19px;
  background:#fffdf0ed;
  border-color:#fff7e4;
  border-radius:20px;
  text-align:left;
  font-size:28px;
  letter-spacing:-1.5px;
  line-height:1;
}
.brand-light{font-weight:400}
.brand small{
  display:block;
  font-size:8px;
  letter-spacing:1.7px;
  margin-top:7px;
  font-weight:600;
}
.brand-mark{
  display:grid;
  place-items:center;
  border-radius:50%;
  background:#e8edce;
  width:40px;
  height:40px;
  font-size:35px;
  color:#527968;
  letter-spacing:0;
}
.carnet{
  display:flex;
  align-items:center;
  gap:10px;
  background:#fffdf0ed;
  border:1px solid #fff7e4;
  border-radius:18px;
  padding:14px 18px;
  font-size:13px;
}
.carnet>span:first-child{font-size:23px}
.carnet b{
  display:inline-block;
  margin-left:10px;
  padding:2px 7px;
  border-radius:7px;
  background:#e5edcf;
  font-size:11px;
}
.sunlight{
  pointer-events:none;
  position:absolute;
  inset:0;
  background:radial-gradient(ellipse at 5% -15%,#fffbd450,transparent 60%);
  mix-blend-mode:screen;
}
.dock{
  position:absolute;
  z-index:3;
  left:24px;
  bottom:44px;
  width:365px;
  max-width:calc(100% - 112px);
  padding:22px 24px;
  border-radius:24px;
  background:#fffdf2f5;
  border:1px solid #ffffef;
  box-shadow:0 12px 40px #335f5526;
  animation:rise .3s ease-out;
}
.dock[hidden]{display:none}
.dock p{font-size:13px;color:#667a6d;margin-top:11px;line-height:1.55}
.dock .primary{
  margin-top:18px;
  width:100%;
  display:flex;
  align-items:center;
  justify-content:space-between;
}
.dock .dock-top{display:flex;gap:14px;align-items:center;padding-right:20px}
.dock .dock-top h2{font-size:25px}
.dock-icon{
  width:48px;
  height:48px;
  border-radius:17px;
  background:#e9eaca;
  flex-shrink:0;
  display:grid;
  place-items:center;
  font-size:30px;
}
.dock-close{
  position:absolute;
  right:10px;
  top:10px;
  border:0;
  background:transparent;
  width:30px;
  height:30px;
  padding:0;
  font-size:20px;
  font-weight:400;
  color:#71867c;
}
.dock details{margin-top:12px}
.dock summary{
  font-size:12px;
  text-decoration:underline;
  text-underline-offset:3px;
  cursor:pointer;
  color:#5f7d6a;
}
.dock details p{
  max-height:min(220px,27vh);
  overflow:auto;
  padding-right:7px;
  font-size:13px;
  color:#40594b;
}
.map-tools{
  position:absolute;
  right:24px;
  bottom:44px;
  z-index:3;
  display:flex;
  flex-direction:column;
  gap:7px;
}
.map-tools button{
  width:48px;
  height:44px;
  padding:0;
  font-size:24px;
  background:#fffdf2ed;
  box-shadow:0 3px 10px #3467560a;
}
.map-tools #boat-toggle{height:64px;border-radius:17px;font-size:28px;line-height:1}
.map-tools button span{display:block;font-size:9px;font-weight:600;margin-top:4px}
.map-tools button[aria-pressed=true]{background:#365f50;color:#fffdf2;border-color:#365f50}
.map-hint{
  position:absolute;
  left:24px;
  bottom:15px;
  font-size:10px;
  letter-spacing:.3px;
  color:#365e57;
  pointer-events:none;
}
.arrival{
  position:absolute;
  top:102px;
  left:50%;
  transform:translateX(-50%);
  border-radius:50px;
  background:#315e50;
  color:#fffdf2;
  padding:9px 18px;
  font-size:12px;
  box-shadow:0 5px 20px #395d4820;
  pointer-events:none;
  opacity:0;
  transition:opacity .3s;
  max-width:calc(100% - 32px);
  text-align:center;
}
.arrival.visible{opacity:1}

.water-label{font-size:10px;letter-spacing:3px;fill:#457f83;opacity:.42}
.compass-text{font-size:9px;fill:#7b9275}
.station-pin,.map-service{cursor:pointer;outline:none}
.pin-halo,.service-halo{fill:#fff9db;opacity:0;transition:opacity .2s}
.pin-dot{
  fill:#fffdf2;
  stroke:#fffbe2;
  stroke-width:3;
  filter:drop-shadow(0 2px 3px #37665430);
}
.pin-num{font-size:12px;font-weight:bold;fill:#526e5c}
.pin-label-bg{fill:#fffdf2;stroke:#cdd9bf;stroke-width:.8}
.pin-label,.kiosk-label{font-size:10px;fill:#526b56}
.pin-label,.pin-label-bg{opacity:0;transition:opacity .2s;pointer-events:none}
.station-pin:hover .pin-label,
.station-pin:hover .pin-label-bg,
.station-pin:focus-visible .pin-label,
.station-pin:focus-visible .pin-label-bg,
.station-pin.selected .pin-label,
.station-pin.selected .pin-label-bg{opacity:1}
.station-pin.selected .pin-dot,.station-pin:hover .pin-dot{fill:#315e50}
.station-pin.selected .pin-num,.station-pin:hover .pin-num{fill:#fffdf2}
.station-pin.selected .pin-halo,.station-pin:hover .pin-halo{opacity:.45}
.map-service:hover .service-halo,
.map-service.selected .service-halo,
.map-service:focus-visible .service-halo{opacity:.6}
.station-pin.done .pin-dot{stroke:#739c63;stroke-width:4}
.station-pin:focus-visible .pin-dot{stroke:#8563a8;stroke-width:4}
.river-dashes{animation:river 14s linear infinite}
.turbine-rotor{transform-box:fill-box;transform-origin:center;animation:turn 8s linear infinite}
.fall-lines{animation:river 1.4s linear infinite}
.park-walker{animation:walk var(--walk-time) linear var(--walk-delay) infinite alternate}
.walker-body{animation:bob .65s ease-in-out infinite alternate}
.walker-leg{
  transform-box:fill-box;
  transform-origin:50% 0;
  animation:step .65s ease-in-out infinite alternate;
}
.leg-right{animation-direction:alternate-reverse}
#visitor-boat{pointer-events:none}
#visitor-boat .boat-ripple{animation:ripple 2.2s ease-out infinite;transform-origin:center}
.motion-paused #park-svg *{animation-play-state:paused!important}
.boat-tag{
  font-size:8px;
  font-weight:700;
  letter-spacing:1px;
  fill:#365f50;
  text-anchor:middle;
  paint-order:stroke;
  stroke:#fffde9;
  stroke-width:3px;
}

dialog{
  width:min(650px,calc(100% - 24px));
  max-height:90dvh;
  border:1px solid #cbd9bd;
  border-radius:28px;
  background:#fffdf2;
  color:var(--ink);
  padding:28px;
  box-shadow:0 30px 100px #214c4940;
  overscroll-behavior:contain;
}
dialog::backdrop{background:#264e4873;backdrop-filter:blur(5px)}
.dialog-head{
  display:flex;
  justify-content:space-between;
  gap:20px;
  align-items:flex-start;
  position:sticky;
  top:-28px;
  background:#fffdf2;
  z-index:2;
  padding:0 0 16px;
  margin:0 0 12px;
}
.dialog-head .eyebrow{margin-top:3px;color:#708372}
.dialog-head button{border:1px solid #dce5cc}
.dialog-copy p{margin:12px 0 22px}
.dialog-copy>p:first-child{margin-top:0;font-size:15px}
.dialog-copy article{border-top:1px solid var(--line);padding:20px 0}
.dialog-copy article h3{font-size:21px}
.stage{
  padding:24px;
  background:radial-gradient(ellipse at top,#eff4d9,#dbe9d6);
  border:0;
  border-radius:23px;
  margin:18px 0;
  min-height:170px;
  text-align:center;
  display:flex;
  flex-direction:column;
  justify-content:center;
}
.stage strong{font-size:22px;font-weight:500}
.stage.tile-grid{display:grid}
.actions{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin-top:18px}
.actions button{min-width:80px}
.stage .actions{margin-top:0}
.status{
  display:flex;
  justify-content:space-between;
  gap:15px;
  padding:0;
  background:transparent;
  border-radius:10px;
  margin:14px 0;
  font-size:13px;
  color:#6b806f;
}
.feedback{min-height:22px;font-size:13px;color:#5c875a;margin:10px 0 0}
.feedback.error{color:#ac635e}
.game-note{font-size:11px;color:#708372;margin-top:8px}
.game-note summary{cursor:pointer}
.game-note p{margin:8px 0}
.note{font-size:11px;color:#829078;margin-top:15px}
.big-symbol{font-size:56px;display:block;line-height:1.3}
.tile-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{min-height:70px}
.selected-answer{background:#d5e6b3}
.sequence{display:flex;gap:7px;flex-wrap:wrap;justify-content:center}
.base{
  padding:8px 13px;
  background:#f7f4e8;
  border:1px solid #d4d8ba;
  border-radius:10px;
  font-weight:bold;
}
.base.active{outline:2px solid #a18ab4}
.base.filled{background:#cfdfa9}
.tank{
  height:185px;
  width:170px;
  border:5px solid #90aaa2;
  border-radius:10px 10px 25px 25px;
  position:relative;
  overflow:hidden;
  background:#f7faf0;
  margin:14px auto;
}
.tank-water{position:absolute;bottom:0;width:100%;background:#7ab7c2;transition:height .15s}
.tank-target{
  position:absolute;
  width:100%;
  border-top:2px dashed #719653;
  border-bottom:2px dashed #719653;
  background:#d4e5a666;
}
.tank-label{position:absolute;inset:0;display:grid;place-items:center;font-size:25px}
.water-slider{width:min(100%,350px);accent-color:#64978b}
.race-stage{
  height:280px;
  padding:0;
  position:relative;
  overflow:hidden;
  background:#92ccc6;
  display:block;
}
.race-track{
  position:absolute;
  inset:0;
  background:repeating-linear-gradient(
    to bottom,
    transparent 0,
    transparent calc(33.333% - 2px),
    #f3f3cc99 calc(33.333% - 2px),
    #f3f3cc99 33.333%
  );
}
.race-player{
  position:absolute;
  left:12%;
  top:50%;
  width:42px;
  height:33px;
  border:8px solid #e6ae83;
  border-radius:50%;
  background:#c7e1d4;
  transform:translateY(-50%);
  transition:top .12s;
  z-index:2;
}
.race-player:after{
  content:'';
  position:absolute;
  left:6px;
  top:-8px;
  width:10px;
  height:10px;
  border-radius:50%;
  background:#efd0ad;
}
.race-obstacle{
  position:absolute;
  width:25px;
  height:25px;
  border:5px solid #f6f0cd;
  background:#98afa6;
  border-radius:50%;
  transform:translateY(-50%);
}
.race-hit .race-player{border-color:#c57476}
.meter{height:5px;background:#dee8d3;border-radius:8px;overflow:hidden}
.meter span{display:block;height:100%;background:#85a871;width:0}
.cell{
  min-height:230px;
  width:100%;
  border:7px solid #b0bda2;
  border-radius:46%;
  position:relative;
  background:#dfebe1;
  margin:15px auto;
}
.cell button{
  position:absolute;
  font-size:11px;
  padding:12px;
  border-radius:40%;
  background:#d8c5e6;
  border-color:#aa8fb9;
}
.cell button:nth-child(1){left:40%;top:30%}
.cell button:nth-child(2){left:12%;top:63%;background:#edc6a0}
.cell button:nth-child(3){right:10%;top:60%;background:#c9d7a4}
.cell button:nth-child(4){left:12%;top:12%;background:#eadbae}
.win-icon{
  display:grid;
  place-items:center;
  width:90px;
  height:90px;
  border-radius:50%;
  background:#e4eccc;
  font-size:50px;
  margin:18px auto;
}
.win{text-align:center}
.win p{font-size:14px;color:#647b6a}
.win .primary{width:100%}
.passport-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}
.passport-grid button{
  padding:13px 7px;
  min-height:90px;
  font-size:10px;
  font-weight:400;
  border-style:dashed;
}
.passport-grid button.done{background:#e6eed2;border-color:#9db17d;border-style:solid}
.passport-grid span{display:block;font-size:28px}
.passport-grid small{display:block;margin-top:5px;font-size:9px}
.settings-list{display:flex;flex-direction:column;gap:10px}
.settings-list button{text-align:left;font-size:14px}
.text-button{
  border:0;
  background:none;
  padding:10px 0;
  font-size:12px;
  text-decoration:underline;
  font-weight:400;
}
.project-text article{padding:18px 0;border-top:1px solid var(--line)}
.project-text p{font-size:14px}
.project-text h3{font-size:23px}
.settings-note{font-size:12px;color:#718375;margin:15px 0!important}

@keyframes river{to{stroke-dashoffset:-160}}
@keyframes turn{to{transform:rotate(360deg)}}
@keyframes walk{to{transform:translate(var(--walk-x),var(--walk-y))}}
@keyframes bob{to{transform:translateY(-.6px)}}
@keyframes step{from{transform:rotate(-18deg)}to{transform:rotate(18deg)}}
@keyframes ripple{
  0%{transform:scale(.7);opacity:.5}
  100%{transform:scale(1.6);opacity:0}
}
@keyframes rise{
  from{opacity:0;transform:translateY(12px)}
  to{opacity:1;transform:translateY(0)}
}

@media(max-width:650px){
  .hud{top:max(12px,env(safe-area-inset-top));left:12px;right:12px}
  .brand{padding:11px 13px;font-size:24px;gap:8px;border-radius:16px}
  .brand-mark{width:32px;height:32px;font-size:29px}
  .brand small{font-size:6px;letter-spacing:1.3px}
  .carnet{padding:10px 12px;min-height:56px;font-size:11px;gap:6px}
  .carnet b{display:block;width:max-content;margin:2px 0 0}
  .carnet>span:first-child{font-size:19px}
  .dock{
    left:12px;
    bottom:max(40px,env(safe-area-inset-bottom));
    max-width:calc(100% - 80px);
    width:330px;
    padding:18px;
    border-radius:21px;
  }
  .dock .dock-top{gap:9px}
  .dock .dock-top h2{font-size:22px}
  .dock .dock-icon{width:38px;height:38px;border-radius:12px;font-size:25px}
  .dock p{font-size:12px}
  .dock .primary{margin-top:13px;padding:10px 14px}
  .dock .eyebrow{font-size:8px;letter-spacing:1.5px;margin-bottom:5px}
  .map-tools{right:12px;bottom:40px;gap:5px}
  .map-tools button{width:43px;height:40px}
  .map-tools #boat-toggle{height:57px}
  .map-hint{left:12px;bottom:14px;font-size:8px}
  .arrival{top:82px;font-size:11px;min-width:200px}
  dialog{padding:20px;border-radius:24px}
  .dialog-head{top:-20px}
  .dialog-head h2{font-size:24px}
  .passport-grid{grid-template-columns:repeat(3,1fr)}
  .tile-grid{grid-template-columns:repeat(2,1fr)}
  .actions{gap:7px}
  .actions button{padding:11px 12px;font-size:13px}
  .stage{padding:18px}
  .stage strong{font-size:19px}
}
@media(max-height:550px){
  .dock{bottom:28px;padding:14px 18px}
  .dock.welcome p{display:none}
  .dock h1{font-size:25px}
  .map-tools{bottom:26px;flex-direction:row;align-items:flex-end}
  .map-hint{bottom:6px}
  .dock details p{max-height:90px}
  .dock .primary{margin-top:10px}
  .arrival{top:18px}
}
@media(prefers-reduced-motion:reduce){
  *,*:before,*:after{animation:none!important;transition:none!important}
}
</style>
</head>

<body>
<main id="park" aria-label="BioParc, le parc aquatique du vivant">
  <div id="viewport" aria-label="Carte du parc. Fais glisser pour te déplacer."></div>
  <div class="sunlight" aria-hidden="true"></div>

  <header class="hud">
    <button class="brand" id="home" aria-label="Voir tout le parc">
      <span class="brand-mark">≈</span>
      <span>bio<span class="brand-light">parc</span><small>L’ARCHIPEL DU VIVANT</small></span>
    </button>

    <button class="carnet" id="passport-button">
      <span aria-hidden="true">▤</span>
      <span>Mon carnet <b data-progress>0/16</b></span>
    </button>
  </header>

  <div id="arrival" class="arrival" role="status" aria-live="polite"></div>

  <aside class="dock welcome" id="dock" aria-label="Ton escale">
    <span class="eyebrow">UNE JOURNÉE AU BIOPARC</span>
    <h1>Les pieds dans l’eau.<br>La tête dans le vivant.</h1>
    <p>Prends une bouée et choisis une attraction. L’aventure commence ici.</p>
    <button id="enter" class="primary">
      Entrer dans le parc <span aria-hidden="true">→</span>
    </button>
  </aside>

  <div class="map-tools" aria-label="Commandes du parc">
    <button id="boat-toggle" title="Se laisser porter par la rivière"
      aria-label="Faire une balade sur la rivière" aria-pressed="false">
      ↻<span>Balade</span>
    </button>
    <button id="zoom-in" title="Rapprocher la carte" aria-label="Rapprocher la carte">+</button>
    <button id="zoom-out" title="Éloigner la carte" aria-label="Éloigner la carte">−</button>
    <button id="overview" title="Voir tout le parc" aria-label="Voir tout le parc">⤢</button>
    <button id="settings" title="Options et explications" aria-label="Options et explications">⋯</button>
  </div>

  <p class="map-hint" id="map-hint">Choisis une attraction · Fais glisser pour explorer</p>
</main>

<dialog id="dialog" aria-labelledby="dialog-title">
  <div class="dialog-head">
    <div>
      <span class="eyebrow" id="dialog-kicker">BIOPARC</span>
      <h2 id="dialog-title"></h2>
    </div>
    <button id="close-dialog" class="icon-button" aria-label="Retourner au parc">×</button>
  </div>
  <div id="dialog-body" class="dialog-copy"></div>
</dialog>

<script>
'use strict';

const STATIONS = [
  {
    id:"cils",n:1,name:"Le Portique des Cils",short:"Entrée · Cils",
    icon:"〰",point:[555,691],color:"mint",
    text:"À l’entrée du parc, un portique de sécurité inspiré des cils vérifie que les visiteurs n’apportent pas d’objets dangereux. Il contribue ainsi à assurer la sécurité de tout le monde. Dans la nature, les cils servent à déplacer une cellule ou à faire circuler un liquide : leur rôle de détecteur est donc une invention pour mon parc."
  },
  {
    id:"paroi",n:2,name:"Le Dôme Protecteur",short:"Dôme · Paroi",
    icon:"⌒",point:[1040,100],color:"mint",
    text:"Le dôme qui entoure mon parc représente la paroi cellulaire. Il protège les visiteurs et délimite le parc, comme la paroi soutient et protège une cellule végétale. Pour entrer dans le parc, les visiteurs doivent passer par l’entrée principale et son portique de sécurité."

let selected=null,passport={},G=null,raceFrame=0,raceLast=0;
let zoom=1,cam={x:590,y:380},view={x:0,y:0,w:1180,h:760};
let cameraTrip=null,travel=null;
let routeLength=1,boatOffset=0,boatRunning=false;
let worldFrame=0,worldLast=0,toastTimer=0;
let motionPaused=window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const markers=()=>$$('.station-pin,.map-service');
const total=()=>STATIONS.filter(s=>passport[s.id]).length;

try{
  const saved=JSON.parse(localStorage.getItem('bioparc-aquatique-v1')||'{}');
  for(const s of STATIONS)if(saved?.[s.id]===true)passport[s.id]=true;
}catch{}

function save(){
  try{
    localStorage.setItem('bioparc-aquatique-v1',JSON.stringify(passport));
  }catch{}
}

function updateProgress(){
  for(const n of $$('[data-progress]'))n.textContent=total()+'/16';
  for(const p of markers())p.classList.toggle('done',!!passport[p.dataset.station]);
}

function announce(text){
  clearTimeout(toastTimer);
  $('#arrival').textContent=text;
  $('#arrival').classList.add('visible');
  toastTimer=setTimeout(()=>$('#arrival').classList.remove('visible'),3000);
}

function select(id){
  const s=byId(id);
  if(!s)return;
  selected=id;
  for(const p of markers()){
    const active=p.dataset.station===id;
    p.classList.toggle('selected',active);
    p.setAttribute('aria-pressed',String(active));
  }
  const d=$('#dock');
  d.hidden=false;
  d.classList.remove('welcome');
  d.innerHTML=`
    <button class="dock-close" id="hide-dock" aria-label="Masquer la fiche">×</button>
    <div class="dock-top">
      <span class="dock-icon" aria-hidden="true">${s.icon}</span>
      <div>
        <span class="eyebrow">${passport[id]?'✓ SOUVENIR COLLECTÉ':'ESCALE '+String(s.n).padStart(2,'0')}</span>
        <h2>${esc(s.name)}</h2>
      </div>
    </div>
    <p>${INVITATIONS[id]}</p>
    <button class="primary" id="play">
      ${passport[id]?'Rejouer':'À toi de jouer'} <span aria-hidden="true">→</span>
    </button>
    <details id="dock-story">
      <summary>Pourquoi ce nom ?</summary>
      <p>${esc(s.text)}</p>
    </details>`;
  $('#play').onclick=()=>startGame(id);
  $('#hide-dock').onclick=()=>{d.hidden=true;};
}

function viewportSize(){
  const r=$('#viewport').getBoundingClientRect();
  return{w:Math.max(r.width,1),h:Math.max(r.height,1)};
}

function updateCamera(){
  const {w,h}=viewportSize();
  const unit=Math.max(1300/w,920/h)/zoom;
  view={w:w*unit,h:h*unit};
  cam.x=Math.max(-70,Math.min(1250,cam.x));
  cam.y=Math.max(-70,Math.min(830,cam.y));
  view.x=cam.x-view.w/2;
  view.y=cam.y-view.h/2;
  $('#park-svg').setAttribute('viewBox',`${view.x} ${view.y} ${view.w} ${view.h}`);
  $('#zoom-in').disabled=zoom>=3.5;
  $('#zoom-out').disabled=zoom<=.8;
}

function setZoom(value){
  cameraTrip=null;
  zoom=Math.max(.8,Math.min(3.5,value));
  updateCamera();
}

function focusPoint(x,y){
  const mobile=viewportSize().w<650;
  const end={
    x:mobile?x:x-120,
    y:mobile?y+100:y+25,
    zoom:mobile?2.6:1.6
  };
  if(motionPaused){
    cam={x:end.x,y:end.y};
    zoom=end.zoom;
    updateCamera();
    return;
  }
  cameraTrip={from:{...cam,zoom},to:end,t:0};
  startWorld();
}

function overview(){
  cameraTrip=null;
  cam={x:590,y:380};
  zoom=1;
  updateCamera();
}

function nearestOffset(x,y){
  const route=$('#river-route');
  let distance=Infinity,offset=0;
  for(let n=0;n<routeLength;n+=4){
    const p=route.getPointAtLength(n);
    const d=(p.x-x)**2+(p.y-y)**2;
    if(d<distance){distance=d;offset=n;}
  }
  return offset;
}

function drawBoat(){
  const offset=((boatOffset%routeLength)+routeLength)%routeLength;
  const p=$('#river-route').getPointAtLength(offset);
  $('#visitor-boat').setAttribute('transform',`translate(${p.x} ${p.y})`);
}

function visit(id,point){
  const s=byId(id);
  if(!s)return;
  stopBoat();
  const [x,y]=point||s.point;
  select(id);
  focusPoint(x,y);
  const end=nearestOffset(x,y);
  const delta=((end-boatOffset+routeLength*1.5)%routeLength)-routeLength/2;
  if(motionPaused){
    boatOffset=end;
    travel=null;
    drawBoat();
    announce('Bienvenue · '+s.name);
  }else{
    travel={
      start:boatOffset,delta,end,t:0,
      duration:Math.max(.65,Math.min(3,Math.abs(delta)/220)),
      id
    };
    announce('En route · '+s.short);
    startWorld();
  }
  $('#map-hint').textContent='Ton île, ton rythme · Choisis ta prochaine escale';
}

function stopBoat(){
  boatRunning=false;
  $('#boat-toggle').setAttribute('aria-pressed','false');
  $('#boat-toggle').innerHTML='↻<span>Balade</span>';
  $('#boat-toggle').setAttribute('aria-label','Faire une balade sur la rivière');
}

function toggleBoat(){
  if(boatRunning){
    stopBoat();
    announce('La balade est en pause.');
    return;
  }
  travel=null;
  boatRunning=true;
  $('#dock').hidden=true;
  $('#boat-toggle').setAttribute('aria-pressed','true');
  $('#boat-toggle').setAttribute('aria-label','Mettre la balade en pause');
  $('#boat-toggle').innerHTML='Ⅱ<span>Pause</span>';
  overview();
  announce('Laisse-toi porter par la rivière…');
  startWorld();
}

function startWorld(){
  if(!worldFrame){
    worldLast=0;
    worldFrame=requestAnimationFrame(tickWorld);
  }
}

function tickWorld(now){
  worldFrame=0;
  const dt=worldLast?Math.min((now-worldLast)/1000,.05):0;
  worldLast=now;
  if(!document.hidden&&!$('#dialog').open){
    if(cameraTrip){
      cameraTrip.t=Math.min(1,cameraTrip.t+dt/.65);
      const t=1-Math.pow(1-cameraTrip.t,3);
      const a=cameraTrip.from,b=cameraTrip.to;
      cam={x:a.x+(b.x-a.x)*t,y:a.y+(b.y-a.y)*t};
      zoom=a.zoom+(b.zoom-a.zoom)*t;
      updateCamera();
      if(cameraTrip.t===1)cameraTrip=null;
    }
    if(travel){
      travel.t=Math.min(1,travel.t+dt/travel.duration);
      const t=travel.t<.5
        ?2*travel.t*travel.t
        :1-Math.pow(-2*travel.t+2,2)/2;
      boatOffset=travel.start+travel.delta*t;
      drawBoat();
      if(travel.t===1){
        boatOffset=travel.end;
        announce('Bienvenue · '+byId(travel.id).name);
        travel=null;
      }
    }else if(boatRunning){
      boatOffset=(boatOffset+dt*35)%routeLength;
      drawBoat();
    }
  }
  if(cameraTrip||travel||boatRunning){
    worldFrame=requestAnimationFrame(tickWorld);
  }else{
    worldLast=0;
  }
}

function cleanGame(){
  cancelAnimationFrame(raceFrame);
  raceFrame=0;
  raceLast=0;
  G=null;
}

function openDialog(title,html){
  cleanGame();
  stopBoat();
  if(travel){
    boatOffset=travel.end;
    travel=null;
    drawBoat();
  }
  if(cameraTrip){
    cam={x:cameraTrip.to.x,y:cameraTrip.to.y};
    zoom=cameraTrip.to.zoom;
    cameraTrip=null;
    updateCamera();
  }
  cancelAnimationFrame(worldFrame);
  worldFrame=0;
  worldLast=0;
  $('#dialog-kicker').textContent='BIOPARC · UNE ESCALE À LA FOIS';
  $('#dialog-title').textContent=title;
  $('#dialog-body').innerHTML=html;
  if(!$('#dialog').open)$('#dialog').showModal();
  $('#dialog').scrollTop=0;
}

    <div class="settings-list">
      <button id="motion-toggle" aria-pressed="${motionPaused}">
        ${motionPaused?'▷ Reprendre les animations':'Ⅱ Mettre les animations en pause'}
      </button>
      <button id="project-button">Lire les explications du projet →</button>
      <button id="help">Comment explorer ? →</button>
    </div>
    <p class="settings-note">Un parc imaginaire. De vrais mécanismes biologiques.</p>
    <button class="text-button" id="reset">Recommencer mon carnet</button>`);

  $('#motion-toggle').onclick=()=>{
    motionPaused=!motionPaused;
    document.body.classList.toggle('motion-paused',motionPaused);
    if(motionPaused){
      stopBoat();
      if(travel){
        boatOffset=travel.end;
        travel=null;
        drawBoat();
      }
      if(cameraTrip){
        cam={x:cameraTrip.to.x,y:cameraTrip.to.y};
        zoom=cameraTrip.to.zoom;
        cameraTrip=null;
        updateCamera();
      }
    }
    showSettings();
  };

  $('#project-button').onclick=showProject;
  $('#help').onclick=()=>openDialog('Bienvenue dans l’archipel',`
    <p>Touche un numéro sur la carte pour rejoindre une attraction. Appuie sur « À toi de jouer » pour commencer.</p>
    <p>Fais glisser la carte pour regarder autour de toi. Les boutons + et − changent le zoom ; ⤢ montre tout le parc.</p>
    <p>La commande « Balade » fait avancer ta bouée dans la rivière. Tu peux la mettre en pause à tout moment.</p>
    <p>Au clavier : utilise Tab pour choisir une attraction, puis Entrée. Dans la course du R.E., les flèches ↑ et ↓ changent de voie.</p>`);

  $('#reset').onclick=()=>{
    openDialog('Une nouvelle visite ?',`
      <p>Effacer les ${total()} tampons de ton carnet ?</p>
      <div class="actions">
        <button id="keep" class="primary">Garder mes souvenirs</button>
        <button id="erase">Effacer le carnet</button>
      </div>`);
    $('#keep').onclick=showPassport;
    $('#erase').onclick=()=>{
      passport={};
      save();
      updateProgress();
      if(selected)select(selected);
      showPassport();
    };
  };
}

function feedback(text,error=false){
  const el=$('#feedback');
  if(el){
    el.textContent=text;
    el.classList.toggle('error',error);
  }
}

function choices(options){
  return `<div class="actions">${
    options.map(([value,label])=>`
      <button data-value="${esc(value)}">${label}</button>`).join('')
  }</div>`;
}

function bindChoices(fn){
  for(const b of $$('[data-value]',$('#dialog-body'))){
    b.onclick=()=>{
      if(G&&!G.done){
        const value=b.dataset.value;
        fn(value,b);
        const next=$$('[data-value]',$('#dialog-body'))
          .find(el=>el.dataset.value===value&&!el.disabled)
          ||$$('[data-value]',$('#dialog-body')).find(el=>!el.disabled)
          ||$('#continue');
        if(next)next.focus();
      }
    };
  }
}

function base(
  instructions,html,n=0,max=1,
  note='Une représentation simplifiée pour apprendre. Tu peux réessayer autant de fois que tu veux.'
){
  const title=byId(G.id);
  $('#dialog-kicker').textContent='À TOI DE JOUER · '+String(title.n).padStart(2,'0');
  $('#dialog-body').innerHTML=`
    <p>${instructions}</p>
    <div class="status">
      <span>Ta progression</span>
      <b id="game-count">${n} / ${max}</b>
    </div>
    <div class="meter">
      <span id="game-meter" style="width:${n/max*100}%"></span>
    </div>
    ${html}
    <p id="feedback" class="feedback" role="status" aria-live="polite"></p>
    <details class="game-note">
      <summary>Le lien avec la biologie</summary>
      <p>${note}</p>
    </details>`;
}

function win(){
  if(!G||G.done)return;
  const id=G.id,s=byId(id),already=!!passport[id];
  G.done=true;
  cancelAnimationFrame(raceFrame);
  passport[id]=true;
  save();
  updateProgress();
  select(id);
  $('#dialog-kicker').textContent='UN SOUVENIR DE TON ESCALE';
  $('#dialog-body').innerHTML=`
    <div class="win">
      <div class="win-icon" aria-hidden="true">${s.icon}</div>
      <h3>${already?'Bien joué !':'Souvenir collecté !'}</h3>
      <p>${INSIGHTS[id]}</p>
      <button class="primary" id="continue">Retourner au parc →</button>
      <button class="text-button" id="again">Encore un tour</button>
    </div>`;
  $('#again').onclick=()=>startGame(id);
  $('#continue').onclick=()=>{
    $('#dialog').close();
    announce(total()===16
      ?'Les 16 souvenirs sont dans ton carnet !'
      :'La suite de l’aventure t’attend.');
  };
}

function advance(max){
  G.n++;
  if(G.n>=max)win();
  else renderGame();
}

function startGame(id){
  const s=byId(id);
  select(id);
  openDialog(s.name,'');
  G={id,n:0,done:false};

  if(id==='photosynthese')Object.assign(G,{sun:false,water:0,co2:0});
  if(id==='flagelle')G.energy=4;
  if(id==='mitochondries')Object.assign(G,{glucose:false,oxygen:false});
  if(id==='vacuole')G.level=20;
  if(id==='paroi')G.panels=new Set();

  if(id==='reticulum'){
    Object.assign(G,{
      lane:1,progress:0,paused:true,time:0,
      spawn:0,slow:0,obstacles:[]
    });
    renderRace();
    return;
  }
  renderGame();
}

function renderGame(){
  const n=G.n,id=G.id;

  if(id==='cils'){
    const target=n%2?'droite':'gauche';
    base(
      'Suis les flèches : un battement à gauche, un battement à droite.',
      `<div class="stage">
        <span class="big-symbol">${target==='gauche'?'←':'→'}</span>
        <strong>Vers la ${target}</strong>
      </div>
      ${choices([['gauche','← Gauche'],['droite','Droite →']])}`,
      n,4,
      'Les vrais cils déplacent une cellule ou un liquide ; ils ne détectent pas les métaux.'
    );
    bindChoices(v=>v===target
      ?advance(4)
      :feedback('Suis la flèche pour le prochain battement.',true));
  }

  else if(id==='paroi'){
    base(
      'Construis les quatre panneaux du dôme protecteur.',
      `<div class="stage tile-grid">
        ${Array.from({length:4},(_,i)=>`
          <button class="tile ${G.panels.has(i)?'selected-answer':''}"
            data-value="${i}" ${G.panels.has(i)?'disabled':''}>
            ${G.panels.has(i)?'✓':'＋'}<br>Panneau ${i+1}
          </button>`).join('')}
      </div>`,
      G.panels.size,4
    );
    bindChoices(v=>{
      G.panels.add(Number(v));
      G.panels.size===4?win():renderGame();
    });
  }

  else if(id==='decomposition'){
    const items=[
      ['🍎','Trognon de pomme','compost'],
      ['🧴','Bouteille en plastique vide','recyclage'],
      ['🍂','Feuilles mortes','compost'],
      ['🥫','Boîte de conserve vide','recyclage'],
      ['🍌','Peau de banane','compost'],
      ['📰','Journal propre','recyclage']
    ];
    const item=items[n];
    base(
      'Trie les matières organiques et les objets recyclables.',
      `<div class="stage">
        <span class="big-symbol">${item[0]}</span>
        <strong>${item[1]}</strong>
      </div>
      ${choices([['compost','♻ Compost'],['recyclage','↻ Recyclage']])}`,
      n,6,
      'Les consignes de tri peuvent varier selon ta municipalité. Le plastique et le verre ne deviennent pas du compost.'
    );
    bindChoices(v=>v===item[2]
      ?advance(6)
      :feedback('Réessaie : cette matière va dans l’autre catégorie pour ce jeu.',true));
  }

  else if(id==='photosynthese'){
    const ingredients=[['sun','☀ Lumière'],['water','💧 Eau'],['co2','CO₂']];
    base(
      'Offre à la plante les trois ingrédients de la photosynthèse.',
      `<div class="stage">
        <span class="big-symbol">🌱</span>
        <strong>Fais entrer le soleil</strong>
        <p>${[
          G.sun?'☀ Lumière ✓':'☀ Lumière',
          G.water?'Eau ✓':'Eau',
          G.co2?'CO₂ ✓':'CO₂'
        ].join(' · ')}</p>
      </div>${choices(ingredients)}`,
      Number(G.sun)+G.water+G.co2,3,
      'La lumière fournit de l’énergie. L’eau et le dioxyde de carbone permettent de fabriquer des sucres, avec une libération de dioxygène.'
    );
    bindChoices(v=>{
      if(v==='sun')G.sun=true;
      if(v==='water')G.water=1;
      if(v==='co2')G.co2=1;
      G.sun&&G.water&&G.co2?win():renderGame();
    });
    for(const b of $$('[data-value]')){
      b.disabled=b.dataset.value==='sun'
        ?G.sun
        :b.dataset.value==='water'?!!G.water:!!G.co2;
    }
  }

  else if(id==='osmose'){
    const pairs=[[2,6],[8,3],[1,5]];
    const pair=pairs[n];
    const answer=pair[0]<pair[1]?'droite':'gauche';
    base(
      'Vers quel côté l’eau va-t-elle ? Choisis celui qui contient le plus de particules.',
      `<div class="stage tile-grid" style="grid-template-columns:1fr 1fr">
        <div><strong>Gauche</strong><p>${'● '.repeat(pair[0])}</p></div>
        <div><strong>Droite</strong><p>${'● '.repeat(pair[1])}</p></div>
      </div>
      ${choices([['gauche','← Vers la gauche'],['droite','Vers la droite →']])}`,
      n,3,
      'La membrane laisse passer l’eau, mais pas le soluté. À volumes initiaux égaux, l’eau se déplace globalement vers le côté le plus concentré en soluté.'
    );
    bindChoices(v=>v===answer
      ?advance(3)
      :feedback('Compare les concentrations : cherche le côté qui contient le plus de soluté.',true));
  }

  else if(id==='circulation'){
    const destinations=['Muscles','Cerveau','Peau','Reins'];
    base(
      'Livre une bulle de dioxygène à la destination indiquée.',
      `<div class="stage">
        <span class="big-symbol">O₂ →</span>
        <strong>${destinations[n]}</strong>
      </div>
      ${choices(destinations.map(x=>[x,x]))}`,
      n,4,
      'Le sang apporte notamment du dioxygène aux tissus. Ce parcours est une simplification du transport.'
    );
    bindChoices(v=>v===destinations[n]
      ?advance(4)
      :feedback('Vérifie la destination de cette livraison.',true));
  }

  else if(id==='flagelle'){
    base(
      'Utilise de l’énergie pour propulser la cellule jusqu’à l’arrivée.',
      `<div class="stage">
        <span class="big-symbol">∿ →</span>
        <strong>Énergie : ${G.energy}/4</strong>
        <p>Déplacement : ${n}/8</p>
        <div class="meter"><span style="width:${n/8*100}%"></span></div>
      </div>
      ${choices([['move','Propulser la cellule'],['charge','Recharger l’énergie']])}`,
      n,8,
      'Un flagelle utilise de l’énergie ; il ne crée pas cette énergie.'
    );
    bindChoices(v=>{
      if(v==='charge'){
        G.energy=4;
        renderGame();
      }else if(G.energy>0){
        G.energy--;
        advance(8);
      }else{
        feedback('Recharge l’énergie avant de continuer.',true);
      }
    });
  }

  else if(id==='controle'){
    const cases=[
      ['L’ADN a été copié et les vérifications sont réussies.',true],
      ['L’ADN est endommagé et doit être réparé.',false],
      ['La copie de l’ADN est encore incomplète.',false],
      ['Les chromosomes sont correctement attachés au fuseau.',true],
      ['Un chromosome est mal attaché au fuseau.',false]
    ];
    const c=cases[n];
    base(
      'Décide si la cellule peut poursuivre le cycle ou si elle doit s’arrêter.',
      `<div class="stage">
        <span class="big-symbol">✓ ?</span>
        <strong>${c[0]}</strong>
      </div>
      ${choices([['go','Continuer →'],['stop','Arrêter et vérifier']])}`,
      n,5
    );
    bindChoices(v=>(v==='go')===c[1]
      ?advance(5)
      :feedback('Un problème doit être vérifié avant de laisser la cellule continuer.',true));
  }

  else if(id==='noyau'){
    const dna='ATCG';
    const match={A:'T',T:'A',C:'G',G:'C'};
    base(
      'Complète les paires de bases de l’ADN : A avec T, C avec G.',
      `<div class="stage">
        <div class="sequence">
          ${[...dna].map((x,i)=>`
            <span class="base ${i===n?'active':''}">${x}</span>`).join('')}
        </div>
        <div class="sequence" style="margin-top:12px">
          ${[...dna].map((x,i)=>`
            <span class="base ${i<n?'filled':''}">${i<n?match[x]:'?'}</span>`).join('')}
        </div>
      </div>
      ${choices(['A','T','C','G'].map(x=>[x,x]))}`,
      n,4
    );
    bindChoices(v=>v===match[dna[n]]
      ?advance(4)
      :feedback('Rappelle-toi : A–T et C–G.',true));
  }

  else if(id==='mitochondries'){
    base(
      'Apporte du glucose et du dioxygène, puis lance la production d’ATP.',
      `<div class="stage">
        <strong>${G.glucose?'✓':'＋'} Glucose · ${G.oxygen?'✓':'＋'} O₂</strong>
        <span class="big-symbol">→ ATP</span>
      </div>
      ${choices([
        ['glucose','Ajouter du glucose'],
        ['oxygen','Ajouter du dioxygène'],
        ['produce','Produire de l’ATP']
      ])}`,
      n,1,
      'Ce jeu simplifie la respiration cellulaire. Il ne représente pas un rendement biologique.'
    );
    bindChoices(v=>{
      if(v==='glucose')G.glucose=true;
      else if(v==='oxygen')G.oxygen=true;
      else{
        if(!G.glucose||!G.oxygen){
          feedback('Il manque du glucose ou du dioxygène.',true);
          return;
        }
        G.glucose=false;
        G.oxygen=false;
        G.n++;
        if(G.n===1){win();return;}
      }
      renderGame();
    });
  }

  else if(id==='golgi'){
    const cargo=['Membrane','Lysosome','Extérieur'];
    base(
      'Trie chaque cargaison : choisis le toboggan qui mène à sa destination.',
      `<div class="stage">
        <span class="big-symbol">📦</span>
        <strong>Destination : ${cargo[n]}</strong>
      </div>
      ${choices([
        ['Membrane','〰 Membrane'],
        ['Lysosome','〰 Lysosome'],
        ['Extérieur','〰 Extérieur']
      ])}`,
      n,3,
      'Le Golgi modifie, trie et emballe des molécules. Les glissades représentent leur acheminement.'
    );
    bindChoices(v=>v===cargo[n]
      ?advance(3)
      :feedback('La destination est inscrite sur la cargaison.',true));
  }

  else if(id==='ribosomes'){
    const recipe=['GLY','ALA','SER','VAL'];
    base(
      'Assemble les acides aminés dans l’ordre indiqué par la recette.',
      `<div class="stage">
        <p>Recette : ${recipe.join(' → ')}</p>
        <div class="sequence">
          ${recipe.map((x,i)=>`
            <span class="base ${i<n?'filled':''}">${i<n?x:'?'}</span>`).join('')}
        </div>
      </div>
      ${choices(['GLY','ALA','SER','VAL'].map(x=>[x,x]))}`,
      n,4,
      'GLY, ALA, SER et VAL sont des abréviations d’acides aminés. Les ribosomes les assemblent selon une instruction.'
    );
    bindChoices(v=>v===recipe[n]
      ?advance(4)
      :feedback('Choisis le prochain acide aminé de la recette.',true));
  }

  else if(id==='lysosome'){
    const shapes=['▲','●','■'];
    base(
      'Associe chaque molécule à l’enzyme adaptée à sa forme.',
      `<div class="stage">
        <span class="big-symbol">${shapes[n]}</span>
        <strong>Quelle enzyme convient ?</strong>
      </div>
      ${choices(shapes.map(x=>[x,'Enzyme '+x]))}`,
      n,3,
      'La forme est une simplification de la spécificité des enzymes. Le milieu acide du lysosome aide certaines enzymes à fonctionner.'
    );
    bindChoices(v=>v===shapes[n]
      ?advance(3)
      :feedback('Cherche l’enzyme dont la forme correspond.',true));
  }

  else if(id==='vacuole'){
    const [lo,hi]=[[65,80],[35,50],[75,90]][n];
    base(
      'Ajuste la réserve d’eau pour atteindre la zone cible, puis valide.',
      `<div class="stage">
        <strong>Cible : ${lo}–${hi} %</strong>
        <div class="tank">
          <div id="tank-water" class="tank-water" style="height:${G.level}%"></div>
          <div class="tank-target" style="bottom:${lo}%;height:${hi-lo}%"></div>
          <span id="tank-label" class="tank-label">${G.level} %</span>
        </div>
        <label for="level">Niveau d’eau</label>
        <br>
        <input id="level" class="water-slider" type="range"
          min="0" max="100" value="${G.level}">
      </div>
      ${choices([['check','Valider la réserve']])}`,
      n,3,
      'Ces pourcentages sont des objectifs de jeu, pas des valeurs biologiques.'
    );
    $('#level').oninput=e=>{
      G.level=Number(e.target.value);
      $('#tank-water').style.height=G.level+'%';
      $('#tank-label').textContent=G.level+' %';
    };
    bindChoices(()=>G.level>=lo&&G.level<=hi
      ?advance(3)
      :feedback('Ajuste le curseur pour atteindre la zone indiquée.',true));
  }

  else if(id==='cytoplasme'){
    const clues=[
      ['noyau','Contient la majeure partie de l’ADN.'],
      ['mitochondrie','Produit une grande partie de l’ATP.'],
      ['ribosome','Assemble les protéines.'],
      ['golgi','Trie et emballe certaines molécules.']
    ];
    base(
      'Lis l’indice et retrouve la bonne structure dans la cellule.',
      `<div class="stage">
        <strong>${clues[n][1]}</strong>
        <div class="cell">
          ${[
            ['noyau','Noyau'],
            ['mitochondrie','Mitochondrie'],
            ['ribosome','Ribosome'],
            ['golgi','Golgi']
          ].map(([value,label])=>`
            <button data-value="${value}">${label}</button>`).join('')}
        </div>
      </div>`,
      n,4,
      'Le cytoplasme comprend le cytosol et les structures situées hors du noyau.'
    );
    bindChoices(v=>v===clues[n][0]
      ?advance(4)
      :feedback('Relis l’indice et réessaie.',true));
  }
}

function renderRace(){
  base(
    'Évite les obstacles avec ↑ et ↓. À toi la descente !',
    `<div class="stage race-stage" id="race-stage">
      <div class="race-track"></div>
      <div class="race-player" id="race-player" aria-label="Ta bouée"></div>
    </div>
    <div class="actions">
      <button id="race-up" aria-label="Monter d’une voie">↑</button>
      <button id="race-down" aria-label="Descendre d’une voie">↓</button>
      <button class="primary" id="race-pause">Lancer la course</button>
    </div>`,
    0,300,
    'Le jeu représente un transport. Le R.E. participe aussi à la fabrication et au traitement de molécules.'
  );
  $('#race-up').onclick=()=>moveRace(-1);
  $('#race-down').onclick=()=>moveRace(1);
  $('#race-pause').onclick=()=>{
    G.paused=!G.paused;
    $('#race-pause').textContent=G.paused?'Reprendre':'Pause';
    if(!raceFrame){
      raceLast=0;
      raceFrame=requestAnimationFrame(tickRace);
    }
  };
}

function moveRace(direction){
  if(!G||G.id!=='reticulum'||G.done)return;
  G.lane=Math.max(0,Math.min(2,G.lane+direction));
  $('#race-player').style.top=(16.666+G.lane*33.333)+'%';
}

function tickRace(now){
  if(!G||G.id!=='reticulum'||G.done)return;
  const dt=raceLast?Math.min((now-raceLast)/1000,.08):0;
  raceLast=now;

  if(!G.paused&&!document.hidden){
    G.time+=dt;

    if(G.time>=G.spawn){
      G.spawn=G.time+1.6;
      const el=document.createElement('span');
      const lane=Math.floor(Math.random()*3);
      el.className='race-obstacle';
      el.style.top=(16.666+lane*33.333)+'%';
      $('#race-stage').appendChild(el);
      G.obstacles.push({el,lane,x:105,hit:false});
    }

    for(const o of G.obstacles){
      o.x-=26*dt;
      o.el.style.left=o.x+'%';
      if(!o.hit&&o.lane===G.lane&&o.x>9&&o.x<19){
        o.hit=true;
        G.slow=G.time+.7;
        feedback('Obstacle touché : ta bouée ralentit un instant.');
      }
    }

    G.obstacles=G.obstacles.filter(o=>{
      if(o.x< -8){
        o.el.remove();
        return false;
      }
      return true;
    });

    G.progress=Math.min(100,G.progress+dt*(G.time<G.slow?2:5));
    $('#race-stage').classList.toggle('race-hit',G.time<G.slow);
    $('#game-meter').style.width=G.progress+'%';
    $('#game-count').textContent=Math.round(G.progress*3)+' / 300 m';

    if(G.progress>=100){
      win();
      return;
    }
  }
  raceFrame=requestAnimationFrame(tickRace);
}

function initPark(){
  $('#viewport').innerHTML=makeParkMap();

  const boat=$('#visitor-boat');
  boat.innerHTML=
    '<ellipse class="boat-ripple" rx="26" ry="15" fill="none" stroke="#fffde8" stroke-width="2"/>'
    +boat.innerHTML
    +'<text class="boat-tag" y="-23">TOI</text>';

  routeLength=$('#river-route').getTotalLength();
  drawBoat();
  updateCamera();
  updateProgress();
  document.body.classList.toggle('motion-paused',motionPaused);

  let drag=null,suppressClick=false;
  const viewport=$('#viewport');

  viewport.addEventListener('pointerdown',e=>{
    if(e.button!==0||drag)return;
    drag={
      id:e.pointerId,
      x:e.clientX,y:e.clientY,
      cx:cam.x,cy:cam.y,
      moved:false
    };
  });

  viewport.addEventListener('pointermove',e=>{
    if(!drag||e.pointerId!==drag.id)return;
    const dx=e.clientX-drag.x,dy=e.clientY-drag.y;
    if(Math.hypot(dx,dy)>6){
      if(!drag.moved){
        viewport.setPointerCapture(e.pointerId);
        suppressClick=true;
      }
      drag.moved=true;
      cameraTrip=null;
      viewport.classList.add('dragging');
      const size=viewportSize();
      cam={
        x:drag.cx-dx*view.w/size.w,
        y:drag.cy-dy*view.h/size.h
      };
      updateCamera();
    }
  });

  const endDrag=e=>{
    if(!drag||e.pointerId!==drag.id)return;
    const moved=drag.moved;
    drag=null;
    viewport.classList.remove('dragging');
    if(viewport.hasPointerCapture(e.pointerId)){
      viewport.releasePointerCapture(e.pointerId);
    }
    if(moved)setTimeout(()=>{suppressClick=false;},0);
  };

  viewport.addEventListener('pointerup',endDrag);
  viewport.addEventListener('pointercancel',endDrag);

  for(const p of markers()){
    p.onclick=()=>{
      if(suppressClick)return;
      const m=p.getAttribute('transform')
        .match(/translate\(([-\d.]+)[ ,]+([-\d.]+)\)/);
      visit(
        p.dataset.station,
        m?[Number(m[1]),Number(m[2])]:undefined
      );
    };
    p.onkeydown=e=>{
      if(e.key==='Enter'||e.key===' '){
        e.preventDefault();
        p.onclick();
      }
    };
  }

  $('#enter').onclick=()=>visit('cils');
  $('#home').onclick=overview;
  $('#overview').onclick=overview;
  $('#zoom-in').onclick=()=>setZoom(zoom+.35);
  $('#zoom-out').onclick=()=>setZoom(zoom-.35);
  $('#boat-toggle').onclick=toggleBoat;
  $('#passport-button').onclick=showPassport;
  $('#settings').onclick=showSettings;
  $('#close-dialog').onclick=()=>$('#dialog').close();

  $('#dialog').addEventListener('close',()=>{
    cleanGame();
    const target=!$('#dock').hidden&&$('#play')
      ?$('#play')
      :$('#passport-button');
    target.focus();
  });

  window.addEventListener('resize',updateCamera);

  document.addEventListener('keydown',e=>{
    if(G?.id==='reticulum'&&!G.done){
      if(['ArrowUp','w','W'].includes(e.key)){
        e.preventDefault();
        moveRace(-1);
      }
      if(['ArrowDown','s','S'].includes(e.key)){
        e.preventDefault();
        moveRace(1);
      }
    }
  });
}

initPark();
</script>
